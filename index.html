<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lighthouse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared pen-and-ink defs, referenced by every room drawing so they read as one hand. -->
  <svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="rough-soft" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <main class="frame" id="frame">
    <div class="scene" id="scene">
      <h1 id="room-name">&nbsp;</h1>
      <p class="mood" id="room-mood">&nbsp;</p>
      <figure class="illustration" id="illustration"></figure>
      <p id="room-description">&nbsp;</p>
    </div>

    <div class="footer">
      <section class="exits">
        <h2>You can go</h2>
        <ul id="exit-list"></ul>
      </section>

      <aside class="map">
        <h2>Map</h2>
        <svg id="map" viewBox="0 0 104 104" role="img" aria-label="Map of the lighthouse"></svg>
      </aside>
    </div>

    <p id="message" class="message" role="status" aria-live="polite">&nbsp;</p>

    <p class="hint">Use the arrow keys to move.</p>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
